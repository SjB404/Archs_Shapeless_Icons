<svg xmlns="http://www.w3.org/2000/svg" viewBox="66.2 64.4 381.2 381.2">
<!-- Samsung Clock, drawn from measurements of the 512 px Galaxy Store icon (M17, M19): the white face is an exact circle
     (radius 188.6), the purple hour hand and the dark minute hand are straight bars with round ends, and the dark centre ring
     holds a white dot. The minute hand pokes just past the face, like in the app's icon. The face is white in the app, so it
     stays white (R12); the dark hand is a detail inside it (R10). The grey tile is left out (R5). Flat colours (M16). -->
<circle cx="256.83" cy="254.97" r="188.61" fill="#FFFFFF"/>
<path d="M142.40 192.74L255.63 258.32" stroke="#A34CF8" stroke-width="35.5" stroke-linecap="round" fill="none"/>
<path d="M397.40 119.00L254.73 260.12" stroke="#2A2A2A" stroke-width="30.24" stroke-linecap="round" fill="none"/>
<circle cx="254.73" cy="260.12" r="29.6" fill="#2A2A2A"/>
<circle cx="254.73" cy="260.12" r="12.18" fill="#FFFFFF"/>
</svg>
