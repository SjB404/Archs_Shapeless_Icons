<clipPath id="pupB"><path d="M-1000 196.0H364.45L329.95 316.0H-1000Z"/></clipPath>
</defs>
<ellipse cx="167.89" cy="255.99" rx="105.41" ry="132.35" transform="rotate(34.07 167.89 255.99)" fill="#E8EBFF"/>
<g clip-path="url(#pupA)"><ellipse cx="167.89" cy="255.99" rx="89.41" ry="116.35" transform="rotate(34.07 167.89 255.99)" fill="#0B091F"/></g>
<ellipse cx="340.89" cy="255.99" rx="105.41" ry="132.35" transform="rotate(34.07 340.89 255.99)" fill="#E8EBFF"/>
<g clip-path="url(#pupB)"><ellipse cx="340.89" cy="255.99" rx="105.41" ry="132.35" transform="rotate(34.07 340.89 255.99)" fill="#0B091F"/></g>
</svg>

