plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arch.shapeless'
    compileSdk 35

    defaultConfig {
        applicationId 'com.arch.shapeless'
        minSdk 29
        // Built for Android 15 (35). Obtainium can only update the pack without a tap if this is new enough
        // for the phone's Android version: Android 16 needs 34+, Android 17 needs 35+, and newer Android versions
        // will ask for more. Raising it to 36 later also needs the screen to make room for the top and bottom bars
        // itself (see res/values-v35/styles.xml).
        targetSdk 35
        // Every GitHub build gets a higher number, so a new APK installs over the old one.
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        // The version people see (9.9, 10.0, 10.1...) comes from version.txt.
        versionName rootProject.file('version.txt').text.trim()
    }

    // Fixed key, so every build is signed the same way and updates install cleanly.
    signingConfigs {
        release {
            storeFile file('../signing/release.jks')
            storePassword 'shapeless'
            keyAlias 'shapeless'
            keyPassword 'shapeless'
        }
    }

    buildTypes {
        release {
            // Must stay off: launchers look icons up by name, and shrinking would delete them.
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
